name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK & NDK 27
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Setup Rust & aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Patch assistant linker check
        run: |
          python3 -c 'import pathlib; p = pathlib.Path("./assistant/build.gradle"); s = p.read_text(encoding="utf-8"); old = "throw new GradleException(\"Android NDK arm64 linker tools missing under ${toolchain}\")"; new = "println(\"WARNING: skipping strict linker check under ${toolchain}\")"; assert old in s; p.write_text(s.replace(old, new, 1), encoding="utf-8"); print("Patched assistant/build.gradle successfully")'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          ANDROID_NDK_HOME: "${ANDROID_HOME}/ndk/27.3.13750724"
          ANDROID_NDK_ROOT: "${ANDROID_HOME}/ndk/27.3.13750724"
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
